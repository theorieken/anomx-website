<svg width="1600" height="900" style="width:1600px;height:900px" xmlns="http://www.w3.org/2000/svg" class="xfel-system-map" viewBox="0 0 960 640" role="img" aria-label="Animated, schematic system map: two offset accelerator rings at the DESY campus and the European XFEL linear accelerator starting near the center of the smaller ring and extending toward Schenefeld. Connected through data and shared system context. Not a scale map or live measurement."><style>/* A quiet system sketch. Theme colors come directly from the public design system. */
.xfel-system-visual { --map-reveal:1; position:relative; width:100%; height:100%; background:#101012; color:#7bd5ff; overflow:hidden; }
.xfel-system-map { display:block; width:100%; height:100%; }
.xfel-system-map path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
.xfel-terrain { fill:none; stroke:#a1a1a6; stroke-width:1; opacity:.08; }
.xfel-system-map .xfel-system-footprint path { fill:#7bd5ff; fill-opacity:.035; stroke:#7bd5ff; stroke-opacity:.08; stroke-width:1; }
.xfel-route-base { fill:none; stroke:#7bd5ff; stroke-opacity:.18; stroke-width:2; }
.xfel-route-active path { fill:none; stroke:#7bd5ff; stroke-width:2; stroke-opacity:.8; stroke-dasharray:1; stroke-dashoffset:calc(1 - 1); }
.xfel-packet { fill:#7bd5ff; opacity:0; }
.xfel-system-visual[data-animated] .xfel-packet { opacity:1; }
.xfel-route-active>g:first-child .xfel-packet { fill:#f18f1f; }
.xfel-buildings rect,.xfel-halls rect { fill:#000000; stroke:#7bd5ff; stroke-opacity:.3; stroke-width:1; }
.xfel-halls rect { fill:#101012; stroke-opacity:.55; }
.xfel-channel-nodes { opacity:clamp(.25,calc(1 * 1.5),1); }
.xfel-channel-nodes circle { fill:#101012; stroke:#7bd5ff; stroke-opacity:.2; stroke-width:1; }
.xfel-channel-nodes .xfel-node-center { fill:#7bd5ff; stroke:none; }
.xfel-campus-node circle { fill:#101012; stroke:#7bd5ff; stroke-width:1; }
.xfel-campus-node circle:first-child { fill:#7bd5ff; fill-opacity:.05; stroke-opacity:.15; }
.xfel-campus-node circle:nth-child(2) { stroke-opacity:.6; }
.xfel-campus-node path { stroke:#7bd5ff; stroke-width:1.6; }
.xfel-map-labels text { fill:#f5f5f7; font:500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; letter-spacing:-.3px; }
.xfel-map-labels .xfel-map-caption { fill:#a1a1a6; font-size:11px; letter-spacing:2px; }
.xfel-map-key text { fill:#a1a1a6; font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; letter-spacing:1.2px; }
.xfel-map-key circle { fill:#7bd5ff; }
